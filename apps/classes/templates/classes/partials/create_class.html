{% load static %}
<form method="post" hx-post="{% url 'create-classroom' org_path=org_path org_id=org_id %}" hx-target="this"
    hx-swap="outerHTML" @click.outside="formOpen = false; $el.remove();">
    {% csrf_token %}
    <div class="flex flex-col items-center text-md md:text-lg py-3 px-6 gap-x-2 cursor-pointer">
        <div  class="text-center">
            <img class="size-15 block mx-auto" src="{% static 'orgs/icons/svg/classroom.svg' %}" alt="Classroom">
            {{ form.name }}
        </div>
    </div>
    {% include "partials/form_errors.html" %}
</form>
