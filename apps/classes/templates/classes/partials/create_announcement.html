<form hx-post="{% url 'create-announcement' classroom_id=classroom_id %}" hx-swap="afterbegin" hx-target="#announcements" @announcement-created="classroom_modal.close();">
    <div class="flex flex-col justify-center items-center gap-1 p-3">
        <p class="text-2xl font-bold text-center">Create Announcement</p>
        <div class="flex flex-col gap-3 w-full">
            {{ form.body }}
            <button type="submit" class="base-button bg-blue-500 hover:bg-blue-700" @announcement-created="classroom_modal.close();">Submit</button>
        </div>
    </div>
    {% include "partials/form_errors.html" %}
</form>
