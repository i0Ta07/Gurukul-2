<form hx-post="{% url 'delete-classroom' parent_org_id=parent_org_id classroom_id=classroom_id %}" hx-target="#classroom-{{ classroom_id }}" hx-swap="delete">
    <div class="flex flex-col p-3 gap-3">
        <h1 class="text-2xl text-center">Are you sure you want to delete {{ classroom_name }} ?</h1>
        <div class="flex justify-between gap-3">
            <button class="base-button bg-red-500 hover:bg-red-700 w-50" @click="org_modal.close();" type="submit">Yes</button>
            <button class="base-button bg-blue-500 hover:bg-blue-700 w-50" type="button" @click="org_modal.close();">No</button>
        </div>
    </div>
</form>
