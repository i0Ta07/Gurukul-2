<form hx-post="{% url 'leave-classroom' classroom_id=classroom_id %}">
    <div class="flex flex-col items-center justify-center gap-1.5">
        <h1>Leave Classroom</h1>
        <p>Are you sure want to leave {{ classroom_name }}?</p>
        <div class="flex gap-1.5 w-full">
            <button class="w-full base-button bg-red-700 hover:bg-red-900" type="submit">Leave</button>
            <button class=" w-full base-button bg-blue-700 hover:bg-blue-900" type="button">No, I'll stay</button>
        </div>
    </div>
</form>
