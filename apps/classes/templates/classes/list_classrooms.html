{% extends "base.html" %}
{% load static %}
{% block title %}My Classrooms{% endblock %}

{% block content %}

<div class="page-container" id="page-container" hx-target="#page-container" hx-boost="true" hx-history-elt>
    {% partialdef list-classrooms inline %}
    <title>Classrooms</title>
    <h1 class="text-lg lg:text-3xl">Classrooms</h1>
    <div class="flex flex-wrap">
        {% for classroom in classrooms %}
        <div class="flex flex-col items-center text-sm lg:text-lg p-1 lg:p-3 cursor-pointer min-w-20">
            <a href="{% url 'view-classroom-dashboard' classroom_id=classroom.id  %}" class="text-center">
                <img class="size-12 xl:size-15 block mx-auto" src="{% static 'orgs/icons/svg/classroom.svg' %}" alt="Classroom">
                <label class="font-bold min-w-20">{{ classroom.name|truncatechars:15 }}</label>
            </a>
        </div>
        {% endfor %}
    </div>
    {% endpartialdef list-classrooms %}
</div>
{% endblock content %}
