{% extends "base.html" %}
{% load static %}
{% block title %}My Classrooms{% endblock %}

{% block content %}

<div class="page-container" id="page-container" hx-target="#page-container" hx-boost="true" hx-history-elt>
    {% partialdef list-classrooms inline %}
    <title>My Classrooms</title>
    <h1>Your classrooms</h1>
    <div class="flex flex-wrap">
        {% for classroom in classrooms %}
        <div class="flex flex-col items-center text-md md:text-lg py-3 px-3 lg:px-6 cursor-pointer min-w-35">
            <a href="{% url 'view-classroom-students' classroom_id=classroom.id  %}" class="text-center">
                <img class="size-15 block mx-auto" src="{% static 'orgs/icons/svg/classroom.svg' %}" alt="Classroom">
                <label class="font-bold min-w-20">{{ classroom.name|truncatechars:15 }}</label>
            </a>
        </div>
        {% endfor %}
    </div>
    {% endpartialdef list-classrooms %}
</div>
{% endblock content %}
