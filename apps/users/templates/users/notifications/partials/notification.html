<div class="fixed top-15 right-5 z-50 flex flex-col gap-2 m-4 fade-in-from-right cursor-pointer" hx-push-url="true"
    @click="$el.classList.add('fade-out-to-right'); setTimeout(() => $el.remove(), 800)"
    hx-get="{{ notification.url_path }}" hx-swap="innerHTML" hx-target="#page-container">
    <div role="alert" class="alert alert-outline text-wrap max-w-md lg:max-w-lg opacity-100 transition-opacity duration-1000
        {% if notification.code == 'error' %}
        alert-error 
        {% elif notification.code == 'info' %}
        alert-info
        {% elif notification.code == 'success' %}
        alert-success
        {% elif notification.code == 'warning' %}
        alert-warning
        {% endif %}">
        <span>{{ notification.body }}</span>
    </div>
</div>
