{% extends "base.html" %}
{% block content %}

<main class="px-4 md:px-8">
    <div class="min-h-screen flex flex-col items-center justify-center">
        <div class="max-w-md w-full">
            <div class="p-6 rounded-lg  border shadow-xs md:p-8 bg-black border-neutral-700">
                <h1 class=" text-center text-3xl font-bold text-slate-50">Change Your Password</h1>
                <form class="space-y-6 mt-10" method="post">
                    {% csrf_token %}
                    <div>
                        <label
                            class="mb-2 font-medium text-sm inline-block text-slate-50">{{form.old_password.label}}</label>
                        <input type="password" name="old_password"
                            class="px-3 py-2.5 text-sm  rounded-md w-full outline-1 -outline-offset-1  focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 text-slate-50 bg-black outline-neutral-700"
                            required placeholder="••••••••" />
                    </div>
                    <div>
                        <label
                            class="mb-2 font-medium text-sm inline-block text-slate-50">{{form.new_password1.label}}</label>
                        <input type="password" name="new_password1"
                            class="px-3 py-2.5 text-sm  rounded-md w-full outline-1 -outline-offset-1  focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 text-slate-50 bg-black outline-neutral-700"
                            required placeholder="••••••••" />
                    </div>
                    <div>
                        <label
                            class="mb-2 font-medium text-sm inline-block text-slate-50">{{form.new_password2.label}}</label>
                        <input type="password" name="new_password2"
                            class="px-3 py-2.5 text-sm  rounded-md w-full outline-1 -outline-offset-1  focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 text-slate-50 bg-black outline-neutral-700"
                            required placeholder="••••••••" />
                    </div>
                    <button type="submit"
                        class="w-full py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer tracking-wide text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                        Update Password
                    </button>
                </form>

            </div>
        </div>
    </div>
</main>
{% include "partials/form_errors.html#form-errors" %}
{% endblock content %}
