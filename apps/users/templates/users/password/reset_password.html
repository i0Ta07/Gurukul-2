{% extends "base.html" %}
{% block content %}
<main class="px-4 md:px-8">
    <div class="min-h-screen flex flex-col items-center justify-center">
        <div class="max-w-md w-full">
            <div class="p-6 rounded-lg  border shadow-xs md:p-8 bg-black border-neutral-700">
                <h1 class=" text-center text-3xl font-bold text-slate-50">Forgot Password</h1>
                <form class="space-y-6 mt-10" method="post">
                    {% csrf_token %}
                    <div>
                        <label class="mb-2 font-medium text-sm inline-block text-slate-50">{{ form.email.label}}</label>
                        <input type="email" name="email"
                            class='px-3 py-2.5 text-sm  rounded-md  w-full outline-1 -outline-offset-1  focus:outline-2 focus:-outline-offset-2 focus:outline-blue-600 text-slate-50 bg-black outline-neutral-600'
                            autocomplete="email" required placeholder="john_doe@gmail.com">
                    </div>
                    <button type="submit"
                        class="w-full py-2 px-3.5 text-sm rounded-md font-semibold cursor-pointer tracking-wide text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                        Submit
                    </button>
                    <div class="flex flex-col items-center">
                        <a href="{% url 'login' %}"
                            class=" hover:underline ml-1 font-medium text-blue-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded">
                            Login here</a>
                        <a href="{% url 'register-email' %}"
                            class=" hover:underline ml-1 font-medium text-blue-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded">
                            Create a new account</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>

{% include "partials/form_errors.html#form-errors" %}
{% endblock content %}
