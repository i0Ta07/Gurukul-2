{% extends "base.html" %}
{% block content %}
<div class="page-container items-center justify-center ">
    <div class="bordered-card md:w-md">
        <h1 class=" text-center">Forgot Password</h1>
        <form class="space-y-6 mt-10" method="post">
            {% csrf_token %}
            <div>
                <label class="mb-2 text-sm form-label">{{ form.email.label}}</label>
                <input type="email" name="email" class='form-input' required placeholder="john_doe@gmail.com">
            </div>
            <button type="submit" class="base-button bg-blue-600 hover:bg-blue-700">
                Submit
            </button>
            <div class="flex flex-col items-center">
                <a href="{% url 'login' %}" class="hyperlink">
                    Login here</a>
                <a href="{% url 'register-email' %}" class="hyperlink">
                    Create a new account</a>
            </div>
        </form>
    </div>
</div>

{% include "partials/form_errors.html" %}
{% endblock content %}
