{% extends "base.html" %}

{% block title %}
Home
{% endblock %}

{% block content %}
<div>
    <h1>Welcome to Gurukul</h1>
    <p>This is the landing page.</p>
    {% if request.user.is_authenticated %}
    <button><a href="{% url 'users-dashboard' %}">Dashboard</a></button>
    {% else %}
    <button><a href="{% url 'login' %}">Go to Login Page</a></button>
    <button><a href="{% url 'users-register' %}">Go to Register Page</a></button>
    {% endif %}
</div>
{% endblock %}
