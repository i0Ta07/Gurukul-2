<main class=" flex justify-center p-4 md:p-8">
    <div class="w-full max-w-md mx-auto sm:max-w-4xl">
        <div class="my-12">
            <h1 class=" text-center text-3xl font-bold text-slate-50">Create Account</h1>
        </div>

        <form class="w-full" method="post">
            {% csrf_token %}
            <div class="grid sm:grid-cols-2 gap-6">
                <div>
                    <label class="mb-2  font-medium text-sm inline-block text-slate-50">{{form.first_name.label}}</label>
                    {{ form.first_name }}
                </div>
                <div>
                    <label for="lname"
                        class="mb-2 font-medium text-sm inline-block text-slate-50">{{form.last_name.label }}</label>
                    {{ form.last_name }}
                </div>
                <div>
                    <label class="mb-2 font-medium text-sm inline-block text-slate-50">{{ form.password1.label}}</label>
                    {{ form.password1 }}
                </div>
                <div>
                    <label class="mb-2  font-medium text-sm inline-block text-slate-50">{{form.password2.label}}</label>
                    {{ form.password2 }}
                </div>
                <div class="col-span-2">
                    <label class="mb-2 font-medium text-sm inline-block text-slate-50">{{ form.user_type.label}}</label>
                    {{ form.user_type }}
                </div>
                <div class="flex items-start flex-wrap gap-1 col-span-2">
                    <label class="flex items-center">
                        <input type="checkbox" name="tmc" class="scheme-dark mr-2 w-3 h-3" required class="sr-only">
                        <span class=" text-sm text-slate-50">
                            I accept the
                        </span>
                    </label>
                    <a href="#"
                        class="text-sm font-bold text-blue-700 dark:text-blue-500 hover:underline focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 rounded">
                        Terms and Conditions
                    </a>
                </div>
            </div>

            <div class="mt-6 flex justify-center">
                <button type="submit"
                    class="py-2 px-3.5 text-md rounded-md font-semibold cursor-pointer tracking-wide text-white border border-blue-600 bg-blue-600 hover:bg-blue-700 transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500">
                    Create an account</button>
            </div>
        </form>
    </div>
    </div>
</main>
{% endblock content %}
