{% extends "base.html" %}

{% block title %}User Type Confirmation{% endblock %}

{% block content %}
<div class="page-container items-center justify-center ">
    <div class="bordered-card md:w-md">
        <h1 class=" text-center">Who are you?</h1>
        <form class="mt-5 space-y-3" method="post" action="{% url 'social:complete' backend %}">
            {% csrf_token %}
            {% for value, label in user_type_choices %}
            <div class="flex justify-center">
                <label class="text-lg form-label">
                    <input type="radio" name="user_type" value="{{ value }}" class="scheme-dark mr-2" required>
                    {{ label }}
                </label>
            </div>
            {% endfor %}                
            <button type="submit" class="mt-3 base-button bg-blue-600 hover:bg-blue-700">
                Continue</button>
        </form>
    </div>
</div>

{% include "partials/form_errors.html#form-errors" %}

{% endblock content %}
