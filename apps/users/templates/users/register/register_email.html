{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="form-content my-3 p-3">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5">
                <div class="card shadow-lg border-0 rounded-lg mt-0 mb-5">
                    <div class="card-header justify-content-center">
                        <h3 class="font-weight-light my-4 text-center">Create Account</h3>
                    </div>
                    {% if form.errors %}
                    <div class="alert alert-danger alert-dismissible fade show mb-0" role="alert">
                        <div id="form_errors">
                            {% for _, value in form.errors.items %}
                            <strong>{{ value }}</strong>
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            {% endfor %}
                        </div>
                    </div>
                    {% endif %}
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            <div class="form-row">
                                <div class="col-md-9 offset-md-1">
                                    <div class="form-group">
                                        <label class="small mb-1">{{ form.email.label }}</label>
                                        {{ form.email }}
                                    </div>
                                </div>
                            </div>
                            <div class="col-md-9 offset-md-1 mt-4">
                                <div class="form-group">
                                    <button type="submit" class="col-md-12 btn btn-dark">Send Verification Mail</button><br>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center mb-1">
                        <div class="small">
                            <a href="{% url 'login' %}">Have an account? Go to Sign in</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
