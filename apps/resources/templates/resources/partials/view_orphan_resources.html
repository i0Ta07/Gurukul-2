<div class="flex flex-col flex-1 max-h-100 gap-3">
    <h1 class="text-center text-lg lg:text-2xl">{{ org_name }}'s orphan resources</h1>
    <div class="flex flex-col gap-3 p-1 overflow-y-auto min-h-0 flex-1">
        {% for resource in orphan_resources %}
            {% include 'resources/search_resources.html#resource' %}
        {% empty %}
        <p class="italic font-bold text-gray-500 text-center">There are no orphan resources for this organization.</p>
        {% endfor %}
    </div>
</div>
