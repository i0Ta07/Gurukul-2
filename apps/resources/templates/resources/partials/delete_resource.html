<form hx-post="{% url 'delete-resource' org_id=org_id resource_id=resource_id %}" hx-swap="delete" hx-target="#resource-{{ resource_id }}">
    <div class="flex flex-col gap-1.5 items-center text-center">
        <h1 class="text-2xl">Are you sure you want to delete {{ resource_title }}?</h1>
        <p class="italic text-sm">For security reasons: You cannot delete a resource, if it is attached to a classroom.</p>
        <div class="flex gap-3 w-full">
            <button class="base-button bg-red-500 hover:bg-red-700" @click="resource_modal.close();" type="submit">Yes</button>
            <button type="button" class="base-button bg-blue-500 hover:bg-blue-700" @click="resource_modal.close();">No</button>
        </div>
    </div>
</form>
