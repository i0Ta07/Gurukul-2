<form hx-post="{% url 'detach-resource' org_id=org_id classroom_id=classroom_id resource_id=resource_id %}" 
    hx-target="#res_mem-{{ resource_id }}" hx-swap="delete" @resource-detached="classroom_modal.close();">
    <div class="flex flex-col gap-3">
        <h1 class="text-center">Detach Resource</h1>
        <p>Are you sure you want to detach <span class="font-bold italic text-yellow-500">{{ resource_title }}</span> from <span class="font-bold italic text-yellow-500">{{ classroom_name }}</span></p>
        <div class="flex gap-3">
            <button class="base-button bg-red-500 hover:bg-red-700" type="submit">Yes</button>
            <button class="base-button bg-blue-500 hover:bg-blue-700" type="button" @click="classroom_modal.close();">No</button>
        </div>
    </div>
</form>
