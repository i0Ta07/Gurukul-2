<div class="flex flex-col flex-1 max-h-100 gap-3">
    <h1 class="text-center text-lg lg:text-2xl">View History</h1>
    {% for snapshot in snapshots %}
    <div class="flex flex-col gap-3 p-1 overflow-y-auto min-h-0 flex-1">
        <div class="flex flex-1 p-1">
            {% for key, value in snapshot.items %}
            {{ key }} : {{ value }} >>
            {% endfor %}
        </div>
    </div>
    <hr class="text-gray-600">
    {% empty %}
    <div class="flex flex-col justify-center items-center flex-1">
        <p class="italic font-bold text-gray-500">No History available</p>
    </div>
    {% endfor %}
</div>
