<div class="flex flex-col flex-1 max-h-100 gap-3">
    <h1 class="text-center text-lg lg:text-2xl">View History</h1>
    <div class="flex flex-col gap-3 overflow-y-auto min-h-0 flex-1">
        {% for snapshot in snapshots %}
        <div class="flex flex-1">
            {% for value in snapshot.values %}
            <p class="font-semibold mx-1">{{ value }}</p>
                {% if not forloop.last %}
                 <span>></span> 
                {% endif %}
            {% endfor %}
        </div>
        <hr class="text-gray-600">
        {% empty %}
        <p class="italic font-bold text-gray-500 text-center">No History available for the given resource</p>
        {% endfor %}
    </div>
</div>
