{% load humanize %}
{% for room in rooms %}
<div class="flex flex-col gap-1 h-18 p-3" id="{{ room.classroom.id }}" @click="active = {{ room.classroom.id }}" :class="{ 'bg-gray-800': active === {{ room.classroom.id }} }" hx-get="{% url 'room' room_id=room.classroom.id %}" hx-target="#chat-window" hx-swap="innerHTML">
    <div class="flex justify-between mr-1">
        <h1 class="font-semibold text-xl">{{ room.classroom.name }}</h1>
        <p class="text-gray-400">{{ room.last_message_time|naturaltime }}</p>
    </div>
    <div class="flex gap-1 text-gray-400">
        <p>{{ room.message_body }} </p>
    </div>
</div>
<hr class="border-t-2 border-gray-800 mb-1">
{% empty %}
<div class="flex justify-center items-center  flex-1">
    <p class="text-gray-500 font-bold"> No Recent chats</p>
</div>
{% endfor %}
