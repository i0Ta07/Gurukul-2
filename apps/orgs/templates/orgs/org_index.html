{% extends "base.html" %}

{% block title %}My orgs{% endblock %}

{% block content %}

<div class="d-col">
    {% for root in roots %}
    <div class="fs-3">
        <a href="{% url 'org-detail' org_path=root.path  %}">
            <div>
                <strong>{{ root.name }}</strong>
            </div>
        </a>
        {% empty %}
        <div>No org available</div>
    </div>
    {% endfor %}
</div>
{% endblock content %}
