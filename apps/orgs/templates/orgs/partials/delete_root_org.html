<form hx-post="{% url 'delete-root-org-verify-otp' org_id=org_id %}" hx-target="this" hx-swap="outerHTML"  hx-indicator="#loading"  @submit="body.remove();">
    <div class="htmx-indicator flex flex-col flex-auto items-center" id="loading">
        <span class="loading loading-spinner loading-xl"></span>
    </div>
    <div class="flex flex-col p-3 gap-3" id="body">
        <h1 class="text-2xl text-center">Are you sure you want to delete {{ org_name }} ?</h1>
        <div class="flex justify-between gap-3">
            <button class="base-button bg-red-500 hover:bg-red-700 w-50" type="submit" >Yes</button>
            <button class="base-button bg-blue-500 hover:bg-blue-700 w-50" type="button" @click="template_modal.close();">No</button>
        </div>
    </div>
</form>
