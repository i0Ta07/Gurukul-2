{% load static %}
<div class="bg-slate-950 p-2 xl:p-3 flex items-center flex-wrap justify-between">

    <div class="flex items-center text-white gap-x-3">
        <p class="text-lg xl:text-3xl font-extrabold font-mono hover:scale-105">Gurukul</p>
        <a href="{% url 'users-dashboard' %}" hx-get="{% url 'users-dashboard' %}" hx-push-url="true"
            hx-target="#page-container" hx-swap="innerHTML" class="font-semibold text-sm xl:text-base hover:text-blue-400">
            Dashboard
        </a>
    </div>
    <div class="relative flex items-center text-white" x-data="{ open_dropdown: false }"  sse-connect="{% url 'stream-notifications' %}">
        <div class="flex items-center justify-center gap-x-3">
            {% if request.user.user_type == 'T' %}
            <a href="{% url 'view-invitations' %}" hx-get="{% url 'view-invitations' %}" hx-swap="innerHTML" hx-target="#page-container" hx-push-url="true">
                <div class="avatar indicator"  hx-swap="innerHTML" hx-target="this" sse-swap="invitation_count">
                    {% include 'orgs/partials/invitation_icon.html' %}
                </div>
            </a>
            {% endif %}
            <a href="{% url 'chat-home' %}" hx-get="{% url 'chat-home' %}" hx-swap="innerHTML" hx-target="#page-container" hx-push-url="true">
                <div class="avatar indicator" hx-swap="innerHTML" hx-target="this" sse-swap="message_count">
                    <span class="indicator-item badge badge-sm badge-info p-1">100</span>
                    <img class="size-6 xl:size-8" src="{% static 'chats/icons/png/chats.png' %}" alt="Chats">
                </div>
            </a>
            <button @click="open_dropdown = ! open_dropdown" type="button" class="  flex text-sm rounded-full focus:ring-2">
                {% if user.profile_photo %}
                <img class="size-8 xl:size-10 p-1 rounded-full" src="{{ user.profile_photo.url }}" alt="Profile Picture">
                {% else %}
                <img class="size-8 xl:size-10 p-1 rounded-full" src="{% static 'images/default_profile.png' %}"
                    alt="Default profile">
                {% endif %}
            </button>
        </div>
        <!-- Dropdown menu -->
        <div x-show="open_dropdown" x-cloak  x-transition @click.outside="open_dropdown = false" class="absolute right-0 top-full z-50 rounded-base shadow-lg  bg-slate-950">
            <div class="px-4 py-3 text-xs xl:text-sm border-b">
                <span class="block text-white">{{user.get_full_name}}</span>
                <span class="block text-gray-200">{{user.email}}</span>
            </div>
            <ul class="p-2 text-xs xl:text-sm text-body font-medium">
                <li @click="open_dropdown = false">
                    <a href="{% url 'users-profile' %}" hx-get="{% url 'users-profile' %}" hx-push-url="true" hx-target="#page-container" hx-swap="innerHTML" 
                        class=" inline-flex items-center w-full p-2  text-gray-200 hover:bg-gray-700 hover:text-white hover:rounded-lg">View
                        Profile</a>
                </li>
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit"
                        class="inline-flex items-center w-full p-2  text-gray-200 hover:bg-gray-700 hover:text-white hover:rounded-lg">
                        Logout
                    </button>
                </form>
            </ul>
        </div>
    </div>
</div>
