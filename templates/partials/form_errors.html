{% if form.errors %}
<div class="absolute right-0 bottom-0 z-50">
    {% for _, value in form.errors.items %}
    <div role="alert" class="alert alert-error alert-outline m-4 min-w-md max-w-lg opacity-100 transition-opacity duration-1000">
    <span>{{ value }}</span>
    </div>
    {% endfor %}
</div>
{% endif %}
